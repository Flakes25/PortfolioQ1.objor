{% extends 'base.html' %}

{% block content %}
<div class="contact" style="padding-top: 140px;">
    <h1 style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 45px; margin-bottom: 30px; text-align: center;">Add New Tech Stack</h1>
    
    <div class="contact-card" style="width: 600px; max-width: 95%;">
        <form method="POST" class="portfolio-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Tech Stack Name</label>
                {{ form.name }}
            </div>
            
            <!-- Button Group -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 35px;">
                <a href="{% url 'dashboard' %}" class="btn" style="font-size: 16px; padding: 10px 25px; border-color: rgba(212, 175, 55, 0.4); color: #bbb;">&larr; Back</a>
                <button type="submit" class="btn" style="font-size: 16px; padding: 10px 30px;">Save Tech Stack</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
