{% extends 'base.html' %}

{% block content %}

<section class="about">

    <h1>About Me</h1>

        <div class="about-card">

        {% if person %}
            <h2>{{ person.first_name }} {% if person.middle_name %}{{ person.middle_name }} {% endif %}{{ person.last_name }}</h2>

            <p>{{ person.summary }}</p>
        {% else %}
            <p>Profile information coming soon.</p>
        {% endif %}

    </div>

</section>

{% endblock %}
