{% extends 'base.html' %}

{% block content %}

<section class="project-detail-page">

    <div class="detail-card">

        <h1>{{ project.project_name }}</h1>

        <div class="info">
            <h3>Description</h3>
            <p>{{ project.description }}</p>
        </div>

        <div class="info">
            <h3>Technology Stack</h3>
            <p>{{ project.tech_stack }}</p>
        </div>

        <div class="button-group">
            {% if project.link %}
            <a href="{{ project.link }}" target="_blank" class="visit-btn">
                Visit Project →
            </a>
            {% endif %}

            <a href="javascript:history.back()" class="visit-btn back-btn">
                ← Back
            </a>
        </div>

    </div>

</section>

{% endblock %}
