{% extends 'base.html' %}

{% block content %}

<section class="project-detail-page">

    <div class="detail-card">

        <h1>Add New Project</h1>

        <form method="POST" class="portfolio-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.project_name.id_for_label }}">Project Name</label>
                {{ form.project_name }}
            </div>

            <div class="form-group">
                <label for="{{ form.description.id_for_label }}">Description</label>
                {{ form.description }}
            </div>

            <div class="form-group">
                <label for="{{ form.tech_stack.id_for_label }}">Tech Stack</label>
                {{ form.tech_stack }}
            </div>

            <div class="form-group">
                <label for="{{ form.link.id_for_label }}">Project Link</label>
                {{ form.link }}
            </div>

            <button type="submit" class="visit-btn">
                Add Project
            </button>

        </form>

    </div>

</section>

{% endblock %}
