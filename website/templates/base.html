{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Portfolio</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=7">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>

<div id="stars" aria-hidden="true"></div>
<div id="stars2" aria-hidden="true"></div>
<div id="stars3" aria-hidden="true"></div>

<nav>

    <h2>Wizard Portfolio</h2>

    <div class="links">
    <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>Home</a>
    <a href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}class="active"{% endif %}>About</a>
    <a href="{% url 'projects' %}" {% if request.resolver_match.url_name == 'projects' %}class="active"{% endif %}>Projects</a>
    <a href="{% url 'testimony_list' %}" {% if request.resolver_match.url_name == 'testimony_list' %}class="active"{% endif %}>Testimonials</a>
    <a href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}class="active"{% endif %}>Contact</a>
</div>

</nav>

{% block content %}
{% endblock %}

<footer>
    <p>&copy; {% now "Y" %} Wizard Portfolio</p>
</footer>

<div class="cursor"></div>

<script>

const cursor=document.querySelector(".cursor");

document.addEventListener("mousemove",(e)=>{

cursor.style.left=e.clientX+"px";

cursor.style.top=e.clientY+"px";

});

</script>
</body>
</html>
