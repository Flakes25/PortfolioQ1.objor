{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard Portfolio</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">
</head>

<body>

<nav>

    <h2>Wizard Portfolio</h2>

    <div class="links">
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/contact/">Contact</a>
    </div>

<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>

</nav>

{% block content %}
{% endblock %}

<div class="cursor"></div>

<script>

const cursor=document.querySelector(".cursor");

document.addEventListener("mousemove",(e)=>{

cursor.style.left=e.clientX+"px";

cursor.style.top=e.clientY+"px";

});

</script>
</body>
</html>
