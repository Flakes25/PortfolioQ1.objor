{% extends 'base.html' %}

{% block content %}
<div class="contact">
    <h1 style="font-family: 'Cinzel', serif; color: #d4af37; font-size: 55px; margin-bottom: 50px; text-align: center;">Admin Sign In</h1>
    
    <div class="contact-card" style="width: 500px; max-width: 95%;">
        {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" class="portfolio-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" required placeholder="Enter admin username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>
    </div>
</div>
{% endblock %}
